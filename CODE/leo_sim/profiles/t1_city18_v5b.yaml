# v5 流量标定臂 v5b（2026-10-21）
# 目的：在 24 星"机制验证场景"里把流量推到"有排队"区间，回答"什么样的流量是合适的"。
# 与 v3 的差异（每一条都是为了让**星间链路**成为瓶颈，而不是接入侧或可达性）：
#   1. endpoints 从 2 个手工站点 -> 18 个真实人口城市：OD 对 18x17=306，把流量摊到更多星间链路上，
#      目标是"有排队链路占比 20%-40%"，而不是 v3 的 4/48（8.3%）。
#   2. access.slots_per_satellite 4 -> 32：v4 网格臂只接入 4495 包，瓶颈是接入槽位而不是星间链路。
#   3. offered_mbps 与 duration_s 成反比缩放，保持单次 run 的包数 ≈ 1.1e5（本机算力上限约 250 包/秒）。
# 包仍为 8000 bit、ISL 仍为 10 Mbps（tau_ser=0.8 ms << 一跳传播 6.7 ms，ratio_ser=0.12 达标）。

config_version: leo-sim-config/v1
scenario:
  name: t1-city18-v5b
  duration_s: 15
  time_step_s: 0.1
  num_satellites: 24
  num_planes: 3
  seed: 7
  min_elevation_deg: 5
endpoints:
  sites:
  - name: beijing
    lat: 39.9
    lon: 116.41
    demand_weight: 1.0
  - name: shanghai
    lat: 31.23
    lon: 121.47
    demand_weight: 1.0
  - name: tokyo
    lat: 35.68
    lon: 139.69
    demand_weight: 1.0
  - name: mumbai
    lat: 19.08
    lon: 72.88
    demand_weight: 1.0
  - name: dubai
    lat: 25.2
    lon: 55.27
    demand_weight: 1.0
  - name: moscow
    lat: 55.75
    lon: 37.62
    demand_weight: 1.0
  - name: london
    lat: 51.51
    lon: -0.13
    demand_weight: 1.0
  - name: paris
    lat: 48.86
    lon: 2.35
    demand_weight: 1.0
  - name: lagos
    lat: 6.52
    lon: 3.38
    demand_weight: 1.0
  - name: cairo
    lat: 30.04
    lon: 31.24
    demand_weight: 1.0
  - name: johannesburg
    lat: -26.2
    lon: 28.05
    demand_weight: 1.0
  - name: newyork
    lat: 40.71
    lon: -74.01
    demand_weight: 1.0
  - name: losangeles
    lat: 34.05
    lon: -118.24
    demand_weight: 1.0
  - name: mexicocity
    lat: 19.43
    lon: -99.13
    demand_weight: 1.0
  - name: saopaulo
    lat: -23.55
    lon: -46.63
    demand_weight: 1.0
  - name: sydney
    lat: -33.87
    lon: 151.21
    demand_weight: 1.0
  - name: jakarta
    lat: -6.21
    lon: 106.85
    demand_weight: 1.0
  - name: toronto
    lat: 43.65
    lon: -79.38
    demand_weight: 1.0
demand:
  mode: uniform
  offered_mbps: 60
  packet_bits: 8000
access:
  unavailable_policy: queue
  slots_per_satellite: 32
  uplink_rate_mbps: 1000.0
  downlink_rate_mbps: 1000.0
  uplink_queue_bits: 4000000000
  downlink_queue_bits: 4000000000
  association: bbm
  hysteresis_deg: 0
  min_dwell_s: 0
  acquisition_delay_s: 0.1
links:
  rate_model: constant
  isl_rate_mbps: 10.0
  isl_queue_bits: 1000000
  ge_enabled: false
control_plane:
  enabled: true
  advertise_interval_s: 0.2
  vis_k: 2
routing:
  policy: hop
learning:
  algorithm: none
execution:
  max_events: 20000000
  max_entities: 20000
  max_packets: 400000
  available_capacity_interval_s: 1.0
outputs:
  out_dir: leo_sim_out/t1-city18-v5b
  plotting: false
