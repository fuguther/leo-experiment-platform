config_version: leo-sim-config/v1
scenario:
  name: mlab-e0-calibration-140
  duration_s: 60
  time_step_s: 0.1
  num_satellites: 140
  num_planes: 7
  altitude_km: 600
  inclination_deg: 98.6
  min_elevation_deg: 30
  seed: 7
endpoints:
  grid_deg: 0.25
  aggregation_deg: 1.0
  # A nearby directed cycle in the checked-in measurement snapshot. Keeping
  # the endpoint set explicit makes the V2 trace identity stable and avoids
  # silently pretending that every M-Lab city is a satellite gateway.
  sites:
    - {name: Seattle, lat: 47.449, lon: -122.309, demand_weight: 1}
    - {name: Beavercreek, lat: 45.288, lon: -122.536, demand_weight: 1}
    - {name: Vancouver, lat: 49.194, lon: -123.184, demand_weight: 1}
demand:
  mode: mlab
  offered_mbps: 50
  packet_bits: 8000000
  deadline_s: null
  burst_start_s: 20
  burst_duration_s: 20
  burst_multiplier: 2
access:
  slots_per_satellite: 4
  uplink_rate_mbps: 100
  downlink_rate_mbps: 100
  uplink_queue_bits: 64000000
  downlink_queue_bits: 64000000
  association: bbm
  hysteresis_deg: 0
  min_dwell_s: 0
  acquisition_delay_s: 0.1
links:
  rate_model: mcs
  ge_enabled: false
topology:
  recompute_interval_s: 1.0
  matching: markovian
control_plane:
  enabled: true
  advertise_interval_s: 1.0
  ttl_s: 10
  vis_k: 12
  packet_bits: 8000
routing:
  policy: hop
  max_hops: 64
  learning_enabled: false
learning:
  algorithm: none
execution:
  max_events: 20000000
  max_entities: 2000
  max_packets: 100000
  available_capacity_interval_s: 1.0
outputs:
  out_dir: leo_sim_out/mlab-e0-calibration
  plotting: false
