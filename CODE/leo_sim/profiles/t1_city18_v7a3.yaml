# t1_city18_v7 系列：把"不排队"推到"有排队"的标定臂（2026-10-21 第二轮）
#
# 【为什么换城市集合（覆盖审计，实测）】
# v5a/b/c 用 24 星/3 平面/53°/550 km 星座 + 18 城。容器内几何探针（probe_coverage.py，
# model.Constellation 直接查 ground_visible）实测：beijing/shanghai/mumbai/dubai/moscow/
# johannesburg/losangeles/sydney 共 8 城在整个 8 s 里一次都没有可见卫星，paris 在 8 s 内 0、
# 60 s 内 0.41；只有 9/18 城有覆盖。这正是 v5a/b/c 的 access_admission_rate 恰好 ≈0.499
# 的来源——一半需求永远进不了星上。本系列改用 21 个 duty15=1.00 城市中的 18 个真实城市
# （probe_cities15.py 实测 duty15=1.00），星座/帧结构/ISL 参数全部保持 v5 不变。
#
# 【ratio_ser】实测该拓扑 ISL 一跳距离均值 4 641 km（p50 5 297 km，探针 probe_cities15.py），
# tau_prop(mean)=15.5 ms；8000 bit / 10 Mbps 的 tau_ser=0.8 ms -> ratio=0.052 <= 0.1 达标。
# 用户给的 6.7 ms 对应约 2 000 km 的短跳，本星座平均跳更长，故不需要改 ISL 速率或降包长。
#
# 归因臂 v7a3：+holding_queue_bits 64->256 Mbit

