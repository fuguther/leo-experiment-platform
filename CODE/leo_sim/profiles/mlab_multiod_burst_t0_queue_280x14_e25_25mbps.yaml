# Engineering E0 recalibration arm; not paper-ready.
config_version: leo-sim-config/v1
scenario:
  name: mlab-multiod-burst-t0-queue-280x14-e25-25mbps
  duration_s: 30
  time_step_s: 0.1
  num_satellites: 280
  num_planes: 14
  altitude_km: 600
  inclination_deg: 98.6
  min_elevation_deg: 25
  seed: 7
endpoints:
  grid_deg: 0.25
  sites: []
  mlab_auto: true
  mlab_max_sites: 64
demand:
  mode: mlab
  offered_mbps: 25
  emission_end_s: 20
  packet_bits: 1000000
  deadline_s: null
  burst_start_s: 8
  burst_duration_s: 8
  burst_multiplier: 2
access:
  unavailable_policy: queue
  slots_per_satellite: 4
  uplink_rate_mbps: 100
  downlink_rate_mbps: 100
  uplink_queue_bits: 64000000
  downlink_queue_bits: 64000000
  association: bbm
  hysteresis_deg: 0
  min_dwell_s: 0
  acquisition_delay_s: 0.1
links:
  rate_model: mcs
  ge_enabled: false
topology:
  recompute_interval_s: 1
  matching: markovian
control_plane:
  enabled: true
  advertise_interval_s: 1
  ttl_s: 10
  # Full-information E0 reference for the 280/14 dynamic graph (registered
  # diameter 17); information-ablation experiments may use a smaller k.
  vis_k: 17
  packet_bits: 8000
routing:
  policy: hop
  max_hops: 64
learning:
  algorithm: none
execution:
  max_events: 20000000
  max_entities: 2000
  max_packets: 20000
  available_capacity_interval_s: 1
outputs:
  out_dir: leo_sim_out/mlab-multiod-burst-t0-queue-280x14-e25-25mbps
  plotting: false
