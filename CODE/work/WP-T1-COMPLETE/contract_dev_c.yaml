    unknown loss bounds'
  common_arm_for_this_development: independent seed-7 three-phase, minimum-two-OD calibration frozen
    before evaluation seeds 11/23/42; if coverage incomplete use declared median baseline with NO_STRONG_COMMON
  execution_mode_comparison: same all-offered [1,8) population and D=30 network loss for all five
    modes; additionally report whole-trace outcomes and actual foreground/background/query/precompute/control
    cost, with policy and information differences disclosed
  single_factor_control: seed-11 full-network four-arm comparison; only advertisement interval changes
    from 2.0 to 1.0 seconds, with the same trace, packet sizes, rates, topology, visibility scope,
    predictor, scorer, compute and query service
  cross_run_comparison: forbidden with WP-A or C0-vs-C1 outcomes
