  sensitivity:
  - 0.005
  - 0.02
  bootstrap: not used to claim precision with three independent evaluation blocks; show individual
    values and paired descriptive summary
  dev_seeds:
  - 11
  - 23
  - 42
  confirm_seeds_start: 1001
  sample_size_rule: separate reviewed confirmation design from independent-block variance, predeclared
