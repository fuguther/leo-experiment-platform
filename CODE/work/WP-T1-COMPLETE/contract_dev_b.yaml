schema: wp-t1-complete-development-contract/v1
question: 在同样可获得的信息与平台合法的四方向候选下，候选资源使用时刻的状态预测能否改善端到端转发结果；计入执行与更新成本后是否仍值得采用？
purpose: bounded_development_only
not_formal: true
not_training: true
development_seed_pool: [7, 11, 23, 42]
selected_development_seeds: [11, 23, 42]
confirm_seed_start: 1001
admission_measurement_window_s: [5.0, 20.0]
admission_thresholds:
  min_offered: 1
  min_forward_decisions: 20
  min_comparable_branch_points: 10
  min_competing_branch_points: 5
  min_effective_query_coverage: 0.90
  min_generated_ods: 6
  min_simultaneous_packets: 5
  min_simultaneous_ods: 2
  concurrency_source: exact packet manifest plus packet_fate times in every captured full-network arm; sampled counterfactual branches are excluded
  effective_query_definition: 有限候选评分、有限查询目标与按决策时刻候选映射命名的有向出口资源；无缺项、无回退；从逐候选证据独立复算
  competing_branch_definition: 抽样完整快照分支中至少一个候选出口存在backlog_before大于0比特的queue_enter事件
  branch_sample_note: max_branches表示重演的快照决策数；可比较点数须从冻结窗口内所有合格决策重算，竞争点数按预注册结构规则抽样
  required_direction_order: [N, E, S, W]
  each_decision_must_record: [four_direction_peer_map, route_candidate_mask, physical_legal_mask, final_legal_mask, filter_reasons, candidate_scores, chosen_action]
  outcome_fields_forbidden: [loss, regret, delivery_advantage, arm_ranking, candidate_winner]
a0_smoke:
  scenario_id: steady_multi_od_negative_control_b
  network_seed: 7
  cell_rule: first_b_dev_cell
  gate: stale/now/common/candidate四个全网策略臂均有正发包、转发决策和交付，outcome_document.partition_exact为真，且offered等于输入轨迹行数
  on_failure: stop_before_any_remaining_b_dev_cell;preserve_result;do_not_resume_run
  call_accounting: included in the declared negative-control network cell; not an extra call
simulator_call_budget: 60
b_run_limits:
  max_simulator_calls: 60
  max_b_dev_cells: 40
  max_simulator_wall_s: 3600
  max_cell_wall_s: 120
  max_concurrency: 1
budgets:
  cell_wall_s: 120
  # Suite compilation also packages unrun acceptance/dev-sweep tiers; the B
  # execution itself remains capped independently at 40 cells and 60 calls.
  max_cells: 60
  total_wall_s: 3600
  simulator_call_budget: 60
dev_parameters:
  scenario.duration_s: 50.0
  demand.emission_end_s: 20.0
  demand.packet_bits: 1000000
  time_alignment.enabled: true
  time_alignment.arm: candidate
  time_alignment.predictor: bounded_linear
  time_alignment.common_rule: median_eta
  time_alignment.execution_mode: per_packet
  time_alignment.per_flow_ttl_s: 0.5
  time_alignment.query_delay_s: 0.000001
  async_routing.update_interval_s: 0.5
  async_routing.window_bins: 4
  execution.compute_servers_per_satellite: 1
  execution.compute_delay_s: 0.001
  execution.decision_observation_mode: frozen
statistics:
  unit: scenario x generated OD trace x seed; arms and modes paired within each unit
  packet_is_independent_repeat: false
  main_loss: L=min(delay,D)/D; loss, fully observed beyond D and terminal failure score 1; administrative censoring remains unknown with bounds
  deadline:
    type: declared_development_diagnostic
    value_s: 30.0
    source: frozen B contract, shared by all arms and five modes
    formal_use: forbidden
  population_window_s: [5.0, 20.0]
  primary_comparison: complete paired common regret minus candidate regret within one scenario-trace-seed frozen-snapshot block; positive favors candidate; branch samples are not independent units
  common_arm_for_this_development: median_eta common-future comparator; common_strong selection remains open and is not claimed by this bounded development run
  secondary_network_comparison: shared-D/window candidate versus common full-network loss; four-arm action/fate outcomes paired by identical per-seed OD trace
  execution_mode_comparison: all-offered D=30 loss and separately accounted foreground/background/query cost by mode; state the precomputed build/update scope
  cross_run_comparison: forbidden with WP-A; B has an independent multi-OD time-varying trace, D and population contract
  minimum_substantive_difference: 0.01
  sensitivity: [0.005, 0.02]
  bootstrap: 10000 paired resamples of independent scenario x trace x seed blocks; no significance claim from three development seeds
  dev_seeds: [11, 23, 42]
  confirm_seeds_start: 1001
  sample_size_rule: max(20, ceil((1.96*s/0.005)^2)); do not derive n from best observed effect
  these_are_design_thresholds_not_measurements: true
formal_design:
  ready: false
  reason: development-only; confirmation requires a separate frozen contract, sample-size review, independent review and exact FORMAL_RUN authorization
  confirm_seeds: []
workloads:
  # Development-only synthetic endpoint adjustment selected from
  # geometry/topology screening, without using method outcomes:
  # G1:131:336 resolves to (41.5,156.5), 4967.35 km from North
  # G1:142:270. Certified next_gsl_change checks find no GSL visibility
  # transition on [0,50]s; 5-second topology snapshots keep North-to-candidate
  # shortest paths at 2 ISL hops, and equator-to-candidate at 4. This is a
  # finite three-endpoint corridor, not a locally adjacent North site, a real
  # ground-station claim, or global OD coverage. Geometry does not establish
  # control-advertisement reachability or packet delivery; the VM trace gates
  # those separately.
  sites: &sites
    - {id: equator, lat: 0.1, lon: 0.1}
    - {id: north, lat: 52.6, lon: 90.4}
    - {id: pacific_corridor, lat: 41.5, lon: 156.5}
  flows: &flows
    - {id: equator_to_north, src: equator, dst: north}
    - {id: equator_to_pacific_corridor, src: equator, dst: pacific_corridor}
    - {id: north_to_equator, src: north, dst: equator}
    - {id: north_to_pacific_corridor, src: north, dst: pacific_corridor}
    - {id: pacific_corridor_to_equator, src: pacific_corridor, dst: equator}
    - {id: pacific_corridor_to_north, src: pacific_corridor, dst: north}
  steady_low:
    schema: t1-synthetic-od-workload/v1
    workload_id: steady_low_six_directed_od
    packet_bits: 1000000
    jitter_s: 0.02
    sites: *sites
    flows: *flows
    phases:
      - id: steady
        start_s: 0.0
        end_s: 20.0
        rates_pps: {equator_to_north: 0.5, equator_to_pacific_corridor: 0.5, north_to_equator: 0.5, north_to_pacific_corridor: 0.5, pacific_corridor_to_equator: 0.5, pacific_corridor_to_north: 0.5}
  temporal_transfer:
    schema: t1-synthetic-od-workload/v1
    workload_id: low_growth_hotspot_transfer_decay_six_directed_od
    packet_bits: 1000000
    jitter_s: 0.02
    sites: *sites
    flows: *flows
    phases:
      - id: low
        start_s: 0.0
        end_s: 4.0
        rates_pps: {equator_to_north: 0.5, equator_to_pacific_corridor: 0.5, north_to_equator: 0.5, north_to_pacific_corridor: 0.5, pacific_corridor_to_equator: 0.5, pacific_corridor_to_north: 0.5}
      - id: growth
        start_s: 4.0
        end_s: 12.0
        rates_pps: {equator_to_north: 3.0, equator_to_pacific_corridor: 1.0, north_to_equator: 3.0, north_to_pacific_corridor: 1.0, pacific_corridor_to_equator: 1.0, pacific_corridor_to_north: 1.0}
      - id: transfer
        start_s: 12.0
        end_s: 16.0
        rates_pps: {equator_to_north: 1.0, equator_to_pacific_corridor: 1.0, north_to_equator: 1.0, north_to_pacific_corridor: 3.0, pacific_corridor_to_equator: 1.0, pacific_corridor_to_north: 3.0}
      - id: decay
        start_s: 16.0
        end_s: 20.0
        rates_pps: {equator_to_north: 0.5, equator_to_pacific_corridor: 0.5, north_to_equator: 0.5, north_to_pacific_corridor: 0.5, pacific_corridor_to_equator: 0.5, pacific_corridor_to_north: 0.5}
b_round:
  note: B-only development uses a finite three-endpoint geographic corridor (equator, North, northwest Pacific); normal 24-satellite three-plane platform, six directed ODs, and N/E/S/W action space are retained; this is neither a locally adjacent North cluster nor global OD coverage
  budgets:
    simulator_call_budget: 60
    max_b_dev_cells: 40
    max_cell_wall_s: 120
    total_vm_simulation_wall_s: 3600
    concurrency: 1
  scenarios:
    - id: steady_multi_od_negative_control_b
      business: six simultaneous directed ODs, constant low 3 Mbps nominal total, synthetic seed-bound packet trace
      expectation: negative_control
      workload: steady_low
      profile: CODE/leo_sim/profiles/t1_dev_regional_multiod.yaml
      parameters:
        scenario.duration_s: 50.0
        demand.emission_end_s: 20.0
        demand.packet_bits: 1000000
        execution.compute_delay_s: 0.001
        execution.compute_servers_per_satellite: 1
        time_alignment.enabled: true
      seeds: [7]
      tasks: [network_alignment]
      task_seeds:
        network_alignment: [7]
    - id: temporal_multi_od_transfer_b
      business: six directed ODs; all active while total nominal demand grows from 3 to 10 Mbps, the two hot OD directions transfer at 12 s, then demand decays to 3 Mbps
      expectation: competitive_multi_od
      workload: temporal_transfer
      profile: CODE/leo_sim/profiles/t1_dev_regional_multiod.yaml
      parameters:
        scenario.duration_s: 50.0
        demand.emission_end_s: 20.0
        demand.packet_bits: 1000000
        links.isl_rate_mbps: 5.0
        topology.recompute_interval_s: 5.0
        execution.available_capacity_interval_s: 1.0
        execution.compute_delay_s: 0.001
        execution.compute_servers_per_satellite: 1
        time_alignment.enabled: true
      seeds: [11, 23, 42]
      admission_seed: 11
      tasks: [branch_alignment, network_alignment, execution_modes]
      task_seeds:
        branch_alignment: [11]
        network_alignment: [11, 23, 42]
        execution_modes: [11, 23, 42]
      max_branches: 4
      min_sampled_branches: 4
      replay_seed: 11
      capture_explanation_rule: first_structurally_eligible_sampled_decision
pilot_cell_ids:
  - b-steady_multi_od_negative_control_b-network-seed-7
  - b-temporal_multi_od_transfer_b-network-seed-11
  - b-temporal_multi_od_transfer_b-execution-modes-seed-11
  - b-temporal_multi_od_transfer_b-branch-seed-11
pilot_note: second and final structure-adjustment pilot covers the negative-control four-arm network cell and one complete paired competitive seed (network, five execution modes, and four structurally sampled complete-snapshot decisions under the full N/E/S/W candidate upper bound); it uses four cells and must pass all unchanged structure, denominator, call-budget and cost gates before appending only the remaining four cells
excluded_from_this_matrix:
  - M-Lab and locally registered traffic tables with unverified redistribution rights
  - trained model performance or training
  - all confirmation seeds and formal execution
  - topology/PHY/traffic-factor scans beyond the frozen two-scenario matrix
