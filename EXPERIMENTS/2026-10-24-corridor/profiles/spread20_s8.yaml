# v7b150：第二轮标定三档之一（2026-10-21）
# 底座 = t1_city18_v7a3（18 个 duty15=1.00 真实城市 / 24 星 3 平面 53° 550 km /
#   access slots 256, idle_release 0.2 s, holding 256 Mbit）——接入侧按归因实验结论放宽；
# 【探针臂】与 v7b150 的唯一差异：links.isl_rate_mbps 10.0 -> 5.5 Mbps（ratio_ser≈0.094 仍≤0.1）。
# 目的：用户原始判据是 20%-40% 的有向链路在排队；v7b150（10 Mbps）实测 util≥0.2 占比 16.67%，
# 本臂把同一负载压到更窄容量上，检验是否能进入 20%-40% 区间（同时看热点 ρ 与 ISL 队列是否溢出）。
# （原注释）三档只变 demand.offered_mbps 与 duration_s（固定单档约 4.5-6.0e8 bit 的报价量，
#   使每档墙钟可控且单档包数 ≥5e4）；ISL 保持 constant 10 Mbps、
#   包 8000 bit ⇒ τ_ser=0.8 ms，实测平均一跳 τ_prop≈15.5 ms（48 条有向 ISL 平均 4641 km）
#   ⇒ ratio_ser≈0.05 ≤ 0.1，故按 m00001 允许范围无需改 ISL 速率/包长。
