gates:
  platform_frozen:
    status: blocked
    requires:
      - D1_merged_to_main
      - D2_merged_to_main
      - reward_and_mask_blockers_closed
      - v2_formal_evidence_chain_verified
      - three_final_audit_rounds_no_new_major
      - exact_main_deployed_to_vm
  formal_analysis_available:
    status: completed_verified
    evidence: origin_main_8a30409_EXP-20260829-GLOBAL-PRESSURE-BRACKET-R02_v2_paired_manifest_VERIFIED_and_claim_gate_READY_FOR_INDEPENDENT_CLAIM_REVIEW
    caveat: derived_artifacts_only_raw_events_no_longer_present_see_R8-A1
  t1_platform_ready:
    status: completed_verified
    requires:
      - T1-TIME-LEDGER-PASS
      - T1-DOWNSTREAM-RESOURCE-PASS
      - T1-COUNTERFACTUAL-REPLAY-PASS
      - T1-COMPUTE-DELAY-PASS
      - T1-PRESSURE-WINDOW-PASS
    scope: >-
      PLATFORM CAPABILITY ONLY. This gate says the measurement and
      counterfactual instrumentation exists and was producer-verified. It does
      NOT say the T1 scientific question is answered, that predictive routing
      has value, that an ISL-saturating scenario exists, or that any causal
      experiment is authorized.
    scope_note: >-
      Wording tightened on 2026-09-23 after owner review, to be read as
      "measurement and counterfactual capability finished and PRODUCER-verified;
      the formal causal experiment is NOT yet authorized". Claims that go
      further -- predictive value, stale-neighbour-state effect, ISL saturation
      -- require the Phase 1 micro-mechanism evidence described in
      ANALYSIS/T1-MEASUREMENT-PROTOCOL.md first.
    note: >-
      Review 2026-09-23: keep leo-direct-sim, no simulator rewrite. Data plane,
      control plane/AoI, information-leak control and the formal evidence chain
      are adequate; what is missing is measurement and counterfactual ability
      for the T1 stale-neighbour-state / candidate-arrival-alignment question.
      All five capabilities landed on main in PRs #201-#208. Deployment history
      lives in external_state_recheck.historical: the newest recorded
      deployment is 9f8f626 at 2026-09-23T20:59:32+08:00, and the live VM was
      NOT re-verified afterwards, so this entry must not be cited as the
      current online state.
    known_partial_criteria:
      - gate: T1-COMPUTE-DELAY-PASS
        finding: R8-A10
        detail: >-
          RESOLVED 2026-09-23 (PR #210): refresh is still the default and
          still cannot represent compute-induced staleness, but the second
          mode now exists -- execution.decision_observation_mode=frozen infers
          on the observation captured at decision start and only checks
          legality at commit, recording commit_rejected when the inferred
          action is refused. Producer-verified only; has NOT run on a formal
          VM artifact; v1 restricts it (no learning arm, no forced_actions).
      - gate: T1-PRESSURE-WINDOW-PASS
        finding: R8-A9
        detail: >-
          Access is not unthrottled above ~20 Mbps offered; utilisation
          plateaus near 0.56 instead of approaching 1.0. It is a medium-high
          pressure window and must NOT be used to claim ISL saturation.
    verification_provenance: >-
      SELF-VERIFIED. On 2026-09-23 the owner instructed that the independent
      cold-start review mechanism no longer be used, so no verdict from an
      independent party is bound to these declarations. Each gate below rests
      on: CI green, a real full-suite count run locally by the producer,
      an old-vs-new numerical comparison showing zero result perturbation, and
      the gate-specific tests named in its evidence. AGENTS.md rule 20 is
      therefore UNSATISFIED for these changes and is recorded as such rather
      than silently waived. Treat these statuses as evidence-backed claims by
      the producer, not as independently reviewed conclusions.
  T1-TIME-LEDGER-PASS:
    status: completed_verified
    capability: unique per-decision id, lifecycle milestones, eleven-field fold
    evidence: >-
      kernel.py decision_id + independent timeline sink + decision_ledger.py;
      PR #202 plus R8-A6/R8-A7/R8-A8 fixes. 280-satellite diagnostic profile:
      534 decisions all uniquely identified, 4876 milestones, 0 unaccounted
      ids, t_control_rx 534/534 (was 0/534 before R8-A6). Full suite 864 passed
      vs 855 at the baseline. Old-vs-new digest byte-identical.
  T1-DOWNSTREAM-RESOURCE-PASS:
    status: completed_verified
    capability: candidate-level downstream contention truth, predicted vs realized
    evidence: >-
      kernel.py _peer_downstream_truth + _egress_snapshot, decision_ledger.py
      score_downstream_predictions; PR #204. Contention sweep: egress_bits_delta
      max 0 (1000 Mbps) -> 8000 (8 Mbps) -> 64000 (1 Mbps) while the direction
      match rate stays 1.0, i.e. the direction is right and the RESOURCE belief
      is stale -- exactly the misalignment T1 measures. Full suite 879 passed.
      Old-vs-new digest byte-identical.
  T1-COUNTERFACTUAL-REPLAY-PASS:
    status: completed_verified
    capability: strictly paired forced-action replay
    evidence: >-
      CODE/leo_sim/counterfactual.py + kernel forced_actions hook; PR #206.
      Branch fingerprints proven equal before the branch point, one action
      forced once; forcing the 4-hop direction moves the target packet path
      from [0,1,2] to [0,5,4,3,2] with delivery 2.67s -> 4.68s. Four refusal
      paths tested (same action, unknown decision, illegal direction, learning
      run). Full suite 881 passed. Old-vs-new digest byte-identical.
  T1-COMPUTE-DELAY-PASS:
    status: completed_verified
    capability: decision computation consumes simulated time, with revalidation
    evidence: >-
      execution.compute_delay_s + Kernel.decide_deferred; PR #205. _decide body
      unchanged: it re-reads env.now and rebuilds candidates, so committing
      after the timeout IS the revalidation. delay 0 keeps the synchronous path
      (digest byte-identical to pre-change); delay 0.05/0.5 separates
      t_decision_start from t_commit by exactly the delay and changes the
      event count (2444 -> 2510/2461). Full suite 880 passed.
    known_consequence: >-
      Adding this config key changes config_sha256 for EVERY configuration, so
      config hashes recorded in existing EXPERIMENTS/EXP-*/run-manifest.json
      and their authorization.json can no longer be reused against this code.
      Historical authorizations must not be replayed.
  T1-PRESSURE-WINDOW-PASS:
    status: completed_verified
    capability: analytic single-OD corridor pressure window, quantified
    limitation: >-
      PARTIAL on one of the gate's five criteria. The window EXISTS, is a fixed
      OD hotspot, uses constant PHY, and its directed ISL utilisation is
      quantified (0.02-0.57, up to 55-110x the R02 bracket's ~0.005-0.01) with
      a linear calibration util_max ~= 0.0235 x offered_mbps below 20 Mbps.
      BUT "access is not the bottleneck" holds only below roughly 20 Mbps
      offered: above it the endpoint and holding queues overflow, delivered
      throughput falls (9.66 -> 9.26 -> 5.86 Mbps) and utilisation plateaus
      near 0.56 instead of approaching 1.0. This profile is therefore a
      MEDIUM-HIGH pressure window and must NOT be used to claim ISL
      saturation. Single seed (7); no statistical claim.
    evidence: >-
      CODE/leo_sim/profiles/t1_pressure_corridor.yaml +
      ANALYSIS/T1-PRESSURE-WINDOW.md; PR #207. The profile also documents a
      trap found while building it: without
      execution.available_capacity_interval_s the per-link utilisation
      denominator is the sum of the service windows themselves, so it reads
      ~1.0 for any constant-rate service and measures nothing.
  real_diagnostic_ready:
    status: blocked
    requires:
      - platform_frozen
      - real_traffic_provenance_verified
      - multi_od_and_burst_verified
      - link_utilization_recomputation_verified
      - packet_delay_decomposition_verified
  current_load_levels_frozen:
    status: blocked
    reason: E0_REAL_must_run_after_real_diagnostic_ready
  theory_ready:
    status: blocked
    requires:
      - q0_minimum_loop_verified
      - q0_replay_review_approved
      - per_action_physical_features_verified
      - field_age_provenance_verified

