name: truth-replay-targeted

on:
  push:
    branches: [research/truth-score-replay-20261029]

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - run: python -m pytest CODE/tests/test_truth_score_replay.py -q
