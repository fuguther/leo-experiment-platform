name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 故意不取消进行中的运行。
# WORKING-MODEL 第三节:合并门要求「CI 对 exact head SHA 真实跑完且 success」。
# cancelled 不等于绿 —— 取消进行中的运行会让这道门永远无法满足。
# 若 CI 时长成为问题,应先减少提交频率,而不是把 cancelled 当成绿。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test and core dependencies (T1-pinned versions)
        run: >-
          python -m pip install
          -r CODE/dependencies/t1-vm-linux-aarch64/requirements-direct.in
          -r CODE/dependencies/t1-vm-linux-aarch64/requirements-test.in
          pillow==10.4.0
      - name: Check repository maintenance rules
        run: python -B CODE/scripts/maintenance_check.py --repo .
      - name: Run test suite
        run: python -m pytest CODE/leo_sim/tests CODE/experiment_platform/tests CODE/tests ANALYSIS/tests CODE/scripts/remote/tests -q
