config_version: leo-sim-config/v1
scenario:
  name: t1-grid-hotspot-v4c
  duration_s: 12.0
  time_step_s: 0.1
  num_satellites: 140
  num_planes: 7
  altitude_km: 600
  inclination_deg: 98.6
  min_elevation_deg: 5
  seed: 7
endpoints:
  grid_deg: 0.25
  aggregation_deg: 5
demand:
  mode: hotspot
  
  offered_mbps: 40.0
  packet_bits: 8000
  source_population_exponent: 1
  destination_population_exponent: 1
  gravity_alpha: 1.25
  hotspot_fraction: 0.1
  hotspot_concentration: 0.85
  gravity_d_floor_km: 100
access:
  unavailable_policy: queue
  slots_per_satellite: 8
  uplink_rate_mbps: 1000.0
  downlink_rate_mbps: 1000.0
  uplink_queue_bits: 4000000000
  downlink_queue_bits: 4000000000
  association: bbm
  hysteresis_deg: 0
  min_dwell_s: 0
  acquisition_delay_s: 0.1
links:
  rate_model: constant
  isl_rate_mbps: 10.0
  isl_queue_bits: 1000000
  ge_enabled: false
control_plane:
  enabled: true
  advertise_interval_s: 0.2
  vis_k: 2
routing:
  policy: hop
learning:
  algorithm: none
execution:
  max_events: 20000000
  max_entities: 20000
  max_packets: 200000
  available_capacity_interval_s: 1.0
outputs:
  out_dir: leo_sim_out/t1-grid-140-v4b
  plotting: false
